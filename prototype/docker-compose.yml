services:
  mlflow:
    build: ./docker/mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    container_name: mlops-mlflow

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    container_name: mlops-postgres
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    container_name: mlops-redis
  grafana:
    image: grafana/grafana-oss:11.6.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - postgres
    container_name: mlops-grafana
  api:
    build: .
    command: python -m pipeline.api.app
    ports:
      - "9696:9696"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FAULT_INJECTION: "1"                 # démo uniquement
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"  # si MLflow tombe, échouer vite au lieu de bloquer l'API
      MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
    depends_on:
      - mlflow
    restart: unless-stopped
    container_name: mlops-api
    init: true

  init:
    # Premier démarrage : entraîne et met en production un premier modèle s'il n'y en a pas
    # (télécharge les données la première fois), puis s'arrête. Ne refait rien ensuite.
    build: .
    command: python -m pipeline.bootstrap
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_URL: http://api:9696
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    depends_on:
      - mlflow
      - api
    restart: "no"

  retrain:
    build: .
    command: python -m agents.retrain
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://mlops:mlops@postgres:5432/mlops
      API_URL: http://api:9696
      PYTHONUNBUFFERED: "1"
      RETRAIN_COOLDOWN_MINUTES: "0"   # démo : pas de pause entre deux entraînements
      MIN_IMPROVEMENT: "0.02"       
    volumes:
      - ./data:/app/data
    depends_on:
      mlflow:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_started
      api:
        condition: service_started
      init:
        condition: service_completed_successfully  # un modèle est en production
    restart: unless-stopped
  cost:
    build: .
    command: python -m agents.cost
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://mlops:mlops@postgres:5432/mlops
      MONTHLY_BUDGET: "0.01"   # mettre "0.1" pour la démo du scénario 3 (budget dépassé)
      API_URL: http://api:9696
      PYTHONUNBUFFERED: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # lecture du CPU de l'API (coût servi, taille du serveur)
    depends_on:
      - redis
      - postgres
      - api
    restart: unless-stopped

  quality:
    build: .
    command: python -m agents.quality --year 2023 --month 2 --watch
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://mlops:mlops@postgres:5432/mlops
      QUALITY_OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}  # Ollama tourne sur le PC
      QUALITY_CHECK_MINUTES: "10"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"  # pour Linux (déjà défini sous Docker Desktop)
    depends_on:
      mlflow:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_started
      init:
        condition: service_completed_successfully  # la dérive se mesure contre le modèle en production
    restart: unless-stopped

  reliability:
    build: .
    command: python -m agents.reliability
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://mlops:mlops@postgres:5432/mlops
      API_URL: http://api:9696
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
      PYTHONUNBUFFERED: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # restart / recreate des conteneurs autorisés
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - mlflow
      - redis
      - postgres
    restart: unless-stopped

  orchestrator:
    build: .
    command: python -m agents.orchestrator
    ports:
      - "${ORCHESTRATOR_HOST_PORT:-8080}:8080"  # autre port si 8080 est pris (ex. Oracle)
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://mlops:mlops@postgres:5432/mlops
      MLFLOW_TRACKING_URI: http://mlflow:5000   # interface : modèle en production
      API_URL: http://api:9696                  # interface : santé de l'API
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}  # interface : état d'Ollama
      DEMO_CONTROLS: "1"                        # interface : page Scénarios (boutons de dérive et de panne)
      PYTHONUNBUFFERED: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # interface : état des conteneurs, page Scénarios
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - postgres
    restart: unless-stopped    
volumes:
  mlflow_data:
  postgres_data: